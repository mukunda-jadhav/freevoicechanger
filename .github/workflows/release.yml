name: FreeVoice ready-made voice desktop build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GPU runtime
        run: python -m pip install torch==2.7.1+cu118 torchaudio==2.7.1+cu118 --index-url https://download.pytorch.org/whl/cu118
      - name: Install app dependencies
        run: python -m pip install -r desktop/requirements-app.txt
      - name: Prepare pinned sources and verified models
        run: python desktop/prepare_build.py
      - name: Build desktop application
        run: python desktop/build_desktop.py
      - name: Include instructions
        run: Copy-Item desktop/README.txt desktop/dist/FreeVoice/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FreeVoice-ReadyVoice-Windows-x64
          path: desktop/dist/FreeVoice/
          retention-days: 14
