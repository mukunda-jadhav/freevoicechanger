name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build desktop package
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: FreeVoice-Windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = (Get-ChildItem dist/*.zip).FullName
          $version = python -c "from build import VERSION; print(VERSION)"
          $tag = "v$version"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; build artifacts retained. Bump VERSION for a new release."
          } else {
            gh release create $tag @assets dist/SHA256SUMS.txt --target "$env:GITHUB_SHA" --prerelease --title "FreeVoice $tag" --notes "Windows x64 portable preview. Extract the entire ZIP and open FreeVoice.exe. DSP effects only; no AI voice models or virtual microphone driver."
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          }
