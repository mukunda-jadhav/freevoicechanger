name: FreeVoice Windows desktop release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/release.yml'
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GPU runtime
        run: python -m pip install torch==2.7.1+cu118 torchaudio==2.7.1+cu118 --index-url https://download.pytorch.org/whl/cu118
      - name: Install app dependencies
        run: python -m pip install -r desktop/requirements-app.txt
      - name: Prepare pinned sources and verified models
        run: python desktop/prepare_build.py
      - name: Build desktop application
        run: python desktop/build_desktop.py
      - name: Include source and licenses
        run: python desktop/package_source.py
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          & $compiler desktop/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Copy-Item desktop/dist/FreeVoice-source.zip desktop/release/
          Get-ChildItem desktop/release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content desktop/release/SHA256SUMS.txt
      - name: Publish private development preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          @'
          Windows desktop development preview. Download FreeVoice-Setup-Windows-x64.exe and ALL matching .bin files into the same folder, then run the setup EXE. No Python or coding required. The installer creates a desktop shortcut.

          One female VCTK p231 voice; no training. NVIDIA GPU recommended. A separate virtual audio cable is required for calls. Streaming uses 500 ms blocks plus buffering. Live microphone quality and clean-machine operation still need user validation. This installer is unsigned.

          Includes source and license notices. This repository remains private, so sign in with an account that has access to download.
          '@ | Set-Content release-notes.md
          gh release view desktop-preview *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-preview --target $env:GITHUB_SHA --title 'FreeVoice Windows desktop preview' --prerelease --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload desktop-preview desktop/release/* --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit desktop-preview --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
